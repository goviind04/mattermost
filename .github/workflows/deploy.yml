name: Deploy Mattermost Server

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: teams-runner
    
    steps:
      - name: Stop Server
        run: |
          cd /home/ubuntu/mattermost/server
          sudo make stop-server
          
      - name: Wait for Server to Stop
        run: sleep 3
        
      - name: Pull Latest Changes
        run: |
          cd /home/ubuntu/mattermost
          sudo chown -R ubuntu:ubuntu .git 2>/dev/null || true
          git fetch origin
          git reset --hard origin/master
        
      - name: Start Server
        run: |
          cd /home/ubuntu/mattermost/server
          sudo chown ubuntu:ubuntu mattermost.pid 2>/dev/null || true
          ./start-detached.sh
